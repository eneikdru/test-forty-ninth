version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-epidemiology_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - OBJECT_STORAGE_DIR=/var/data/object_storage
    depends_on:
      - db
      - object-storage
    volumes:
      - object_data:/var/data/object_storage

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-epidemiology_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  object-storage:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - object_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backup-cron:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c", "echo \"${BACKUP_CRON_SCHEDULE:-0 2 * * *} /app/scripts/backup.sh >> /var/log/backup_cron.log 2>&1\" | crontab - && cron -f"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-epidemiology_db}
      - DB_USER=${DB_USER:-postgres}
      - PGPASSWORD=${DB_PASSWORD:-postgres}
      - OBJECT_STORAGE_DIR=/var/data/object_storage
      - BACKUP_DIR=/backups/secondary
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    depends_on:
      - db
      - object-storage
    volumes:
      - db_data:/var/lib/postgresql/data:ro
      - object_data:/var/data/object_storage:ro
      - backups_secondary:/backups/secondary

volumes:
  db_data:
  object_data:
  backups_secondary:
