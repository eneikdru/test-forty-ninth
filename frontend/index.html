<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuStream - Search Analytics Telemetry</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-surface-variant": "#434655",
            "on-primary-fixed": "#00174b",
            "tertiary-fixed": "#d3e4fe",
            "surface-container-low": "#f2f4f6",
            "on-tertiary-fixed-variant": "#38485d",
            "inverse-surface": "#2d3133",
            "surface-container-lowest": "#ffffff",
            "on-error": "#ffffff",
            "tertiary": "#46566c",
            "outline": "#737686",
            "surface-container-high": "#e6e8ea",
            "error-container": "#ffdad6",
            "secondary-fixed-dim": "#bec6e0",
            "on-tertiary-fixed": "#0b1c30",
            "surface-container-highest": "#e0e3e5",
            "tertiary-container": "#5e6e85",
            "on-primary": "#ffffff",
            "secondary-container": "#dae2fd",
            "on-secondary-fixed-variant": "#3f465c",
            "on-secondary-container": "#5c647a",
            "on-background": "#191c1e",
            "surface-dim": "#d8dadc",
            "surface-tint": "#0053db",
            "surface-bright": "#f7f9fb",
            "primary-fixed": "#dbe1ff",
            "on-primary-container": "#eeefff",
            "background": "#f7f9fb",
            "surface": "#f7f9fb",
            "inverse-on-surface": "#eff1f3",
            "on-primary-fixed-variant": "#003ea8",
            "on-tertiary": "#ffffff",
            "tertiary-fixed-dim": "#b7c8e1",
            "outline-variant": "#c3c6d7",
            "surface-variant": "#e0e3e5",
            "on-secondary-fixed": "#131b2e",
            "on-surface": "#191c1e",
            "on-secondary": "#ffffff",
            "on-tertiary-container": "#e9f0ff",
            "secondary": "#565e74",
            "on-error-container": "#93000a",
            "primary-container": "#2563eb",
            "surface-container": "#eceef0",
            "inverse-primary": "#b4c5ff",
            "error": "#ba1a1a",
            "primary": "#004ac6",
            "primary-fixed-dim": "#b4c5ff",
            "secondary-fixed": "#dae2fd"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "margin-mobile": "16px",
            "xl": "32px",
            "base": "4px",
            "sm": "12px",
            "gutter": "16px",
            "margin-desktop": "24px",
            "xs": "8px",
            "lg": "24px",
            "md": "16px"
          },
          "fontFamily": {
            "mono-data": ["JetBrains Mono"],
            "headline-lg-mobile": ["Hanken Grotesk"],
            "body-sm": ["Inter"],
            "display-lg": ["Hanken Grotesk"],
            "headline-md": ["Hanken Grotesk"],
            "body-lg": ["Inter"],
            "body-md": ["Inter"],
            "label-caps": ["Inter"],
            "headline-sm": ["Hanken Grotesk"]
          },
          "fontSize": {
            "mono-data": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
            "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
  <style>
    .telemetry-marker {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px dotted #004ac6;
      border-radius: 50%;
      pointer-events: none;
    }
    .telemetry-label {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      color: #004ac6;
      background: rgba(255,255,255,0.9);
      padding: 1px 4px;
      border: 1px solid #e0e3e5;
      border-radius: 2px;
      pointer-events: none;
      z-index: 100;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
