<style>

        }
        
        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
            background-color: #eceef0; /* surface-container */
        }
        .skeleton-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.4) 20%,
                rgba(255, 255, 255, 0.6) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans pb-16 md:pb-0">

<div class="relative w-full max-w-2xl mx-auto mb-4">

<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Loading Indicator -->

</div>
</div>
