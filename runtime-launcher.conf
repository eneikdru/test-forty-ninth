server {
    listen 8091;

    # Handle POST requests to /healthcheck by proxying to the application's GET /health endpoint
    location /healthcheck {
        proxy_pass http://app:8080/health;
        proxy_method GET;
        # Clear the content-length so Tomcat doesn't wait for a POST body when we proxy as GET
        proxy_set_header Content-Length "";
    }
}
